<div class="container-fluid">
  <!-- Loading de tela cheia -->
  <app-full-screen-loading [show]="loading" message="Pesquisando dados...">
  </app-full-screen-loading>
  <!-- Filtro -->
  <div class="row mb-3">
    <div class="col-12">
      <app-categoriaespecial-filter [hidden]="true"  [value]="filters" (apply)="onFilterApply($event)" (clear)="onFilterClear()">
      </app-categoriaespecial-filter>
    </div>
  </div>
  <!-- Tabela de dados -->
  <div class="card shadow-sm">
    <div class="table-responsive">
      <table class="table table-hover table-sm table-compact align-middle mb-0">
        <thead class="table-header-custom position-sticky top-0" style="z-index:1">
          <tr>
            <th class="text-start" style="width:120px">
              <div class="d-flex align-items-center gap-2 ps-1">
                <button type="button" class="icon-action" title="Exportar Excel" aria-label="Exportar Excel">
                  <i class="fa fa-file-excel-o"></i>
                </button>
                <button type="button" class="icon-action" title="Novo" aria-label="Novo" (click)="irParaNovo()">
                  <i class="fa fa-plus-square-o"></i>
                </button>
              </div>
            </th>
            <th class="text-nowrap">Id</th>
            <th class="text-nowrap">Categoria_id</th>
            <th class="text-nowrap">Quantidade_eixos</th>
            <th class="text-nowrap">Categoria_adm</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dados da tabela -->
          <tr *ngFor="let item of data">
            <td class="text-start">
              <div class="d-flex align-items-center gap-2 ps-1">
                <button type="button" class="icon-action" title="Ver" (click)="irParaVer(item)">
                  <i class="fa fa-eye"></i>
                </button>
                <button type="button" class="icon-action" title="Editar" (click)="irParaEditar(item)">
                  <i class="fa fa-pencil"></i>
                </button>
                <button type="button" class="icon-action" title="Excluir">
                  <i class="fa fa-trash-o"></i>
                </button>
              </div>
            </td>
            <td>
              <span>{{ item.id }}</span>
            </td>
            <td>
              <span>{{ item.categoria_id }}</span>
            </td>
            <td>
              <span>{{ item.quantidade_eixos }}</span>
            </td>
            <td>
              <span>{{ item.categoria_adm }}</span>
            </td>
          </tr>
          <!-- Estado de erro -->
          <tr *ngIf="!loading && error">
            <td colspan="100%" class="p-0">
              <app-error-state [message]="error" [showRetryButton]="true" [onRetryCallback]="retryLoadData">
              </app-error-state>
            </td>
          </tr>
          <!-- Estado vazio -->
          <tr *ngIf="!loading && !error && !data.length">
            <td colspan="100%" class="p-0">
              <app-empty-state></app-empty-state>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
    <!-- Paginação -->
    <app-pagination-footer [currentPage]="currentPage" [pageSize]="pageSize" [total]="total" [showingRange]="showingRange" (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination-footer>
  </div>
</div>
