<!-- Loading and Error States -->
<app-full-screen-loading [show]="loading()" message="Carregando dados...">
</app-full-screen-loading>
<app-compact-error *ngIf="error()" [message]="error() || ''"></app-compact-error>

<!-- Main Card Container -->
<div class="card m-3" *ngIf="!loading()">
  <div class="card-body">
    <form id="tipo-categoria-sr-form" [formGroup]="form" (ngSubmit)="save()" class="needs-validation">

      <!-- Validation Indicator -->
      <app-validation-indicator *ngIf="!loading() && form" [form]="form" [fieldLabels]="fieldLabels">
      </app-validation-indicator>

      <!-- Main Content Row -->
      <div class="row align-items-start mb-3">
        <!-- Description Field -->
        <div class="col-md-8">
          <label class="form-label fw-medium" for="descricao">
            Descrição <span class="text-danger">*</span>
          </label>
          <input class="form-control form-control-sm" id="descricao" type="text" formControlName="descricao"
            [style.border-left]="form.get('descricao')?.invalid ? '3px solid #dc3545' : ''"
            placeholder="Digite a descrição" maxlength="100">
        </div>

        <!-- Status Field -->
        <div class="col-md-4">
          <label class="form-label fw-medium" for="status">
            Status <span class="text-danger">*</span>
          </label>
          <div *ngIf="isViewMode(); else editStatus">
            <select class="form-select form-select-sm" disabled title="Status">
              <option>{{ form.get('status_delecao')?.value === 0 ? 'Ativo' : 'Inativo' }}</option>
            </select>
          </div>
          <ng-template #editStatus>
            <select id="status" class="form-select form-select-sm" formControlName="status_delecao"
              [style.border-left]="form.get('status_delecao')?.invalid ? '3px solid #dc3545' : ''">
              <option [ngValue]="0">Ativo</option>
              <option [ngValue]="1">Inativo</option>
            </select>
          </ng-template>
        </div>
      </div>

      <!-- Audit Info Row -->
      <div class="row align-items-center mb-4" *ngIf="id()">
        <div class="col-12">
          <app-audit [lastUpdateDate]="form.get('data_atualizacao')?.value" [auditData]="getAuditData()">
          </app-audit>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="row">
        <div class="col-12">
          <div class="d-flex justify-content-end gap-1">
            <!-- Botões para modo de edição -->
            <ng-container *ngIf="!isViewMode()">
              <button type="button" class="btn btn-outline-secondary btn-sm px-2 py-1" (click)="goBack()">
                Cancelar
              </button>
              <button type="submit" class="btn btn-success btn-sm px-2 py-1" [disabled]="form.invalid || loading()">
                <i class="fa fa-check me-1"></i>
                Salvar e fechar
              </button>
              <button type="button" class="btn btn-primary btn-sm px-2 py-1" [disabled]="form.invalid || loading()"
                (click)="saveAndContinue()">
                <i class="fa fa-edit me-1"></i>
                Salvar
              </button>
            </ng-container>

            <!-- Botão para modo de visualização -->
            <ng-container *ngIf="isViewMode()">
              <button type="button" class="btn btn-outline-primary btn-sm px-2 py-1" (click)="goBack()">
                <i class="fa fa-arrow-left me-1"></i>
                Voltar
              </button>
            </ng-container>
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
