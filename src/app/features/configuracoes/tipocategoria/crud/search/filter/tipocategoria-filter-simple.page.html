<form [formGroup]="form" (ngSubmit)="onApply()" 
      class="card shadow-sm mb-3 filter-compact"
      [class.has-validation-errors]="form.invalid && form.touched">
  
  <!-- Validation Indicator -->
  <app-validation-indicator 
    [form]="form" 
    [fieldLabels]="fieldLabels">
  </app-validation-indicator>
  
  <div class="card-body py-2">
    <div class="row g-2 align-items-end">

      <!-- Descrição -->
      <div class="col-12 col-md-5">
        <label for="descricao" class="form-label mb-1">
          Descrição <span class="text-danger">*</span>
        </label>
        <input 
          id="descricao" 
          type="text" 
          formControlName="descricao" 
          class="form-control form-control-sm"
          [class.is-invalid]="descricaoControl?.invalid && descricaoControl?.touched"
          placeholder="Filtrar por descrição..."
          maxlength="100">
      </div>

      <!-- Status -->
      <div class="col-6 col-md-3">
        <label for="status" class="form-label mb-1">Status</label>
        <select id="status" formControlName="status_delecao" class="form-select form-select-sm">
          <option value="">Todos</option>
          <option value="0">Ativo</option>
          <option value="1">Inativo</option>
        </select>
      </div>

      <!-- Ações -->
      <div class="col-6 col-md-4 d-flex justify-content-end align-items-end gap-2">
        <button 
          type="button" 
          class="btn btn-outline-secondary btn-sm d-inline-flex align-items-center gap-2"
          (click)="onClear()">
          <i class="fa fa-eraser"></i>
          <span>Limpar</span>
        </button>
        
        <button 
          type="submit" 
          [disabled]="form.invalid"
          class="btn btn-primary btn-sm d-inline-flex align-items-center gap-2">
          <i class="fa fa-search"></i>
          <span>Pesquisar</span>
        </button>
      </div>

    </div>
  </div>
</form>
