<form [formGroup]="gerenciador.form" (ngSubmit)="onApply()" class="card shadow-sm mb-3 filter-compact">
  <div class="card-body py-2">
    <div class="row g-2 align-items-end position-relative">

      <!-- Indicador de validação no canto esquerdo -->
      <app-validation-indicator [form]="gerenciador.form" [validationConfig]="validationConfig"
        [fieldLabels]="fieldLabels">
      </app-validation-indicator>

      <!-- Descrição -->
      <div class="col-12 col-md-5">
        <label for="descricao" class="form-label mb-1">Descrição</label>
        <input id="descricao" type="text" formControlName="descricao" class="form-control form-control-sm"
          [class]="'form-control form-control-sm ' + validationService.getFieldErrorClass(gerenciador.form, 'descricao')"
          placeholder="Filtrar por descrição...">
      </div>

      <!-- Status -->
      <div class="col-6 col-md-3">
        <label for="status" class="form-label mb-1">Status</label>
        <select id="status" formControlName="status_delecao"
          [class]="'form-select status-select ' + validationService.getFieldErrorClass(gerenciador.form, 'status_delecao')">
          <option value="">Todos</option>
          <option value="0">Ativo</option>
          <option value="1">Inativo</option>
        </select>
      </div>

      <!-- Ações -->
      <div class="col-6 col-md-4 d-flex justify-content-end align-items-end gap-2">
        <button type="submit" [disabled]="gerenciador.form.invalid"
          class="btn btn-primary btn-sm d-inline-flex align-items-center gap-2">
          <i class="fa fa-search"></i>
          <span>Pesquisar</span>
        </button>
      </div>

    </div>
  </div>
</form>
