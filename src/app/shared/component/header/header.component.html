<div class="header-wrapper row m-0">
  <div class="header-logo-wrapper col-auto p-0">
    <div class="logo-wrapper">
      <a [routerLink]="['/dashboard/default']">
        <img class="img-fluid for-light" src="assets/images/logo/logo-1.png" alt="">
        <img class="img-fluid for-dark" src="assets/images/logo/logo.png" alt="">
      </a>
    </div>
    <div class="toggle-sidebar" (click)="navigationService.collapseSidebar =!navigationService.collapseSidebar">
      <app-common-svg-icons [class]="'sidebar-toggle'" [icon]="'fill-animation'"></app-common-svg-icons>
    </div>
  </div>
  <div class="left-header col-xxl-5 col-xl-6 col-auto box-col-4 horizontal-wrapper p-0">
    <div class="left-menu-header">
      <ul class="header-left" (clickOutside)="clickOutside()">
        <li>
          <div class="form-group w-100">
            <div class="Typeahead Typeahead--twitterUsers">
              <div class="u-posRelative d-flex">
                <app-common-svg-icons [icon]="'fill-search'"
                  [class]="'search-bg svg-color me-2'"></app-common-svg-icons>
                <input class="demo-input py-0 Typeahead-input form-control-plaintext w-100" type="text"
                  placeholder="Search Kabul .." [(ngModel)]="searchText" (keyup)="search(searchText)">
              </div>
            </div>
            <div class="Typeahead-menu custom-scrollbar" [class.is-open]="searchResult" [class.open]="open">
              @for(menuItem of menuItems | slice : 0 : 8; track menuItem){
              <div class="ProfileCard u-cf" [routerLink]="menuItem.path">
                <div class="ProfileCard-details">
                  <div class="ProfileCard-realName">
                    <a class="realname" (click)="removeFix()">{{ menuItem.title }}</a>
                    <div class="ProfileCard-avatar">
                      <app-svg-icon [icon]="menuItem.icon"></app-svg-icon>
                    </div>
                  </div>
                </div>
              </div>
              }
            </div>
            <div class="Typeahead-menu" [class.is-open]="searchResultEmpty">
              <div class="tt-dataset tt-dataset-0">
                <div class="EmptyMessage">Opps!! There are no result found.</div>
              </div>
            </div>
          </div>
        </li>
      </ul>
    </div>
  </div>
  <div class="nav-right col-xxl-7 col-xl-6 col-auto box-col-6 pull-right right-header p-0 ms-auto">
    <ul class="nav-menus">
      <li class="serchinput"> 
        <div class="serchbox" (click)="isSearch =!isSearch">
          <app-common-svg-icons [icon]="'fill-search'"></app-common-svg-icons>
        </div>
        <div class="form-group search-form" [class.open]="isSearch">
          <input type="text" placeholder="Search here..." [(ngModel)]="searchText" (keyup)="search(searchText)">
          <div class="Typeahead-menu custom-scrollbar" [class.is-open]="searchResult" [class.open]="open">
            @for(menuItem of menuItems | slice : 0 : 8; track menuItem){
            <div class="ProfileCard u-cf" [routerLink]="menuItem.path">
              <div class="ProfileCard-details">
                <div class="ProfileCard-realName">
                  <a class="realname">{{ menuItem.title }}</a>
                  <div class="ProfileCard-avatar">
                    <app-svg-icon [icon]="menuItem.icon"></app-svg-icon>
                  </div>
                </div>
              </div>
            </div>
            }
          </div>
          <div class="Typeahead-menu" [class.is-open]="searchResultEmpty">
            <div class="tt-dataset tt-dataset-0">
              <div class="EmptyMessage">Opps!! There are no result found.</div>
            </div>
          </div>
        </div>
      </li>
      <li class="onhover-dropdown">
        <app-notifications></app-notifications>
      </li>
      <li class="onhover-dropdown">
        <app-bookmark></app-bookmark>
      </li>
      <li class="cart-nav onhover-dropdown">
        <app-cart></app-cart>
      </li>
      <li class="onhover-dropdown">
        <app-message></app-message>
      </li>
      <li>
        <app-mode></app-mode>
      </li>
      <li class="language-nav" (click)="navigationService.language =!navigationService.language">
        <app-language></app-language>
      </li>
      <li class="profile-nav onhover-dropdown p-0">
        <app-profile></app-profile>
      </li>
     
    </ul>
  </div>
</div>
