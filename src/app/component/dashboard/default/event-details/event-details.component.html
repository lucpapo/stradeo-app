<div class="card transaction-history">
  <div class="card-header card-no-border">
    <div class="header-top">
      <h4>Event Details</h4>
      <app-dropdown [data]="dropdownList"></app-dropdown>
    </div>
  </div>
  <div class="card-body pt-0">
    <div class="table-responsive custom-scrollbar">
      <table class="table display" style="width:100%">
        <tbody>
          @for (item of tableData; track item) {
          <tr>
            <td>
              <div class="d-flex">
                <span class="history" [class]="item.class">
                   <app-common-svg-icons [icon]="item.icon"></app-common-svg-icons>
                </span>
                <div class="flex-grow-1 ms-2">
                  <a [routerLink]="['/ecommerce/product-list']">
                    <h5>{{item.title}}</h5><span>{{item.date}}</span>
                  </a>
                </div>
              </div>
            </td>
            <td>{{item.status}}</td>
            <td>+ ${{item.amount | number : '1.2-2'}}</td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
