<div class="card duties-hed">
  <div class="card-header card-no-border pb-0">
    <div class="header-top">
      <h4>The duties of today</h4>
      <app-dropdown [data]="dropdownList"></app-dropdown>
    </div>
  </div>
  <div class="card-body">
    <ul class="task-box">
      <li class="bg-light">
        <div class="d-flex align-items-center justify-content-between task-heading">
          <h6 class="font-primary f-w-500">NFT graphics packages</h6>
          <app-dropdown [data]="dropdownList"></app-dropdown>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="flex-shrink-0"><img src="assets/images/dashboard/user/8.png" alt="user"></div>
          <div class="flex-grow-1">
            <p class="mb-0">Assigned to</p><a href="product-page.html">
              <h5>Hedvige Bussière</h5>
            </a>
          </div>
        </div>
      </li>
      <li class="bg-light">
        <div class="d-flex align-items-center justify-content-between task-heading">
          <h6 class="font-secondary f-w-500">Radio Homepage </h6>
          <app-dropdown [data]="dropdownList"></app-dropdown>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="flex-shrink-0">
            <div class="customers social-group">
              <ul>
                <li class="d-inline-block"><img class="rounded-circle border-0" src="assets/images/dashboard/user/9.png"
                    alt=""></li>
                <li class="d-inline-block"><img class="rounded-circle" src="assets/images/dashboard/user/10.png" alt="">
                </li>
              </ul>
            </div>
          </div>
          <div class="flex-grow-1">
            <p class="mb-0">Assigned to</p><a href="product-page.html">
              <h5>schneider.. </h5>
            </a>
          </div>
        </div>
      </li>
      <li class="bg-light">
        <div class="d-flex align-items-center justify-content-between task-heading">
          <h6 class="font-warning f-w-500">Deliver Dinner Apps</h6>
          <app-dropdown [data]="dropdownList"></app-dropdown>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="flex-shrink-0"><img src="assets/images/dashboard/user/11.png" alt="user"></div>
          <div class="flex-grow-1">
            <p class="mb-0">Assigned to</p><a href="product-page.html">
              <h5>Stéphane Chasse</h5>
            </a>
          </div>
        </div>
      </li>
      <li class="bg-light">
        <div class="d-flex align-items-center justify-content-between task-heading">
          <h6 class="font-success f-w-500">Todo Game Layout</h6>
          <app-dropdown [data]="dropdownList"></app-dropdown>
        </div>
        <div class="d-flex align-items-center gap-2">
          <div class="flex-shrink-0">
            <div class="customers social-group">
              <ul>
                <li class="d-inline-block"><img class="rounded-circle border-0"
                    src="assets/images/dashboard/user/12.png" alt=""></li>
                <li class="d-inline-block"><img class="rounded-circle" src="assets/images/dashboard/user/13.png" alt="">
                </li>
              </ul>
            </div>
          </div>
          <div class="flex-grow-1">
            <p class="mb-0">Assigned to</p>
            <a [routerLink]="['/ecommerce/products']">
              <h5>Isaac Dennis</h5>
            </a>
          </div>
        </div>
      </li>
    </ul>
  </div>
</div>
