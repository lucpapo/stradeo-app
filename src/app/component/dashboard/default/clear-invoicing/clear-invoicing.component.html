<div class="card">
  <div class="card-header card-no-border">
    <div class="header-top">
      <h4>Clear invoicing</h4>
    </div>
  </div>
  <div class="card-body pt-0 open-invoice">
    <div class="table-responsive custom-scrollbar">
      <table class="table display" id="invoice" style="width:100%">
        <thead>
          <tr>
            <th>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="">
                <label class="form-check-label"></label>
              </div>
            </th>
            <th>Invoice</th>
            <th>Customer</th>
            <th>Status</th>
            <th>Amount</th>
            <th>Due Date</th>
            <th> </th>
          </tr>
        </thead>
        <tbody>
          @for (item of tableData; track item) {
          <tr>
            <td>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" value="">
                <label class="form-check-label"></label>
              </div>
            </td>
            <td>{{item.invoice}}</td>
            <td>
              <div class="d-flex">
                <div class="flex-shrink-0">
                  <img [src]="item.customer.image" alt="">
                </div>
                <div class="flex-grow-1 ms-3"><a [routerLink]="['/ecommerce/product-list']">
                    <h5>{{item.customer.name}}</h5><span>{{item.customer.email}}</span>
                  </a></div>
              </div>
            </td>
            <td>
              <button class="btn" [ngClass]="{
                    'btn-primary': item.status === 'Paid',
                    'btn-secondary': item.status === 'Unpaid',
                    'btn-danger': item.status === 'Overdue'  
                  }">{{item.status}}</button>
            </td>
            <td>{{item.amount}}</td>
            <td>{{item.due_date}}</td>
            <td>
              <app-dropdown [data]="dropdownList"></app-dropdown>
            </td>
          </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
