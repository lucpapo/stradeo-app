<div class="card">
    <div class="card-header card-no-border pb-0">
        <div class="header-top">
            <h4>Over All Rating</h4>
            <app-dropdown [data]="dropdownList"></app-dropdown>
        </div>
    </div>
    <div class="card-body pt-0">
        <div class="over-rating">
            <p>A credit rating is a rating of a prospective debtor's credit risk, expecting their ability to
                repay the debt.</p>
            <div class="d-xxl-flex align-items-center">
                <div class="over-all">
                    <h3>4.6</h3><span class="d-block"><i class="fa fa-star font-warning"></i><i
                            class="fa fa-star font-warning"></i><i class="fa fa-star font-warning"></i><i
                            class="fa fa-star font-warning"></i><i
                            class="fa fa-star font-warning"></i></span>
                    <p>A sovereign credit rating refers to the creditworthiness of a sovereign body, such as
                        the national government.</p>
                </div>
                <div class="rating-box d-xxl-block d-none">
                    <div class="d-flex gap-2">
                        <div class="flex-shrink-0">
                            <h3>4.6</h3>
                        </div>
                        <div class="flex-grow-1"><span class="d-flex"><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i></span></div>
                        <p>95%</p>
                    </div>
                    <div class="d-flex gap-2">
                        <div class="flex-shrink-0">
                            <h3>6.2</h3>
                        </div>
                        <div class="flex-grow-1"><span class="d-flex"><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i></span></div>
                        <p>61%</p>
                    </div>
                    <div class="d-flex gap-2">
                        <div class="flex-shrink-0">
                            <h3>5.0</h3>
                        </div>
                        <div class="flex-grow-1"><span class="d-flex"><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i></span></div>
                        <p>34%</p>
                    </div>
                    <div class="d-flex gap-2">
                        <div class="flex-shrink-0">
                            <h3>1.3</h3>
                        </div>
                        <div class="flex-grow-1"><span class="d-flex"><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i><i
                                    class="fa fa-star font-warning"></i></span></div>
                        <p>91%</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
