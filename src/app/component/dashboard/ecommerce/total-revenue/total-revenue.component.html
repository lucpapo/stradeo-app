<div class="card total-revenue">
    <div class="card-header card-no-border pb-2">
        <div class="header-top">
            <h4>Total Revenue</h4>
        </div>
    </div>
    <div class="card-body p-0">
        <div class="row gy-5">
            <div class="col-lg-9 col-md-8">
                <div class="revenue-legend">
                    <ul>
                        <li class="me-3">
                            <div class="circle bg-primary me-1"> </div><span>Earning</span>
                        </li>
                        <li>
                            <div class="circle bg-secondary me-1"></div><span>Expense </span>
                        </li>
                    </ul>
                </div>
                <div class="revenue-chart" id="revenue-chart">
                    <apx-chart [series]="chartData.series" [chart]="chartData.chart" [colors]="chartData.colors"
                        [plotOptions]="chartData.plotOptions" [dataLabels]="chartData.dataLabels"
                        [legend]="chartData.legend" [stroke]="chartData.stroke" [grid]="chartData.grid"
                        [yaxis]="chartData.yaxis" [xaxis]="chartData.xaxis" [responsive]="chartData.responsive">
                    </apx-chart>
                </div>
            </div>
            <div class="col-xl-3 col-lg-3 col-md-4 increase ps-0">
                <div class="d-flex pe-3">
                    <span class="me-2">Year:</span>
                    <span>2024
                        <i class="fa fa-caret-down ms-2"></i>
                    </span>
                </div>
                <div class="total-increase">
                    <h2>$25,837</h2><span>Total : 23,000</span>
                </div>
                <div id="monthlychart">
                    <apx-chart [series]="monthlayChart.series" [chart]="monthlayChart.chart" [colors]="monthlayChart.colors"
                        [fill]="monthlayChart.fill" [dataLabels]="monthlayChart.dataLabels" [stroke]="monthlayChart.stroke"
                        [grid]="monthlayChart.grid" [tooltip]="monthlayChart.tooltip" [xaxis]="monthlayChart.xaxis"
                        [yaxis]="monthlayChart.yaxis"></apx-chart>
                </div>
                <button class="btn btn-primary">Increase</button>
            </div>
        </div>
    </div>
</div>
