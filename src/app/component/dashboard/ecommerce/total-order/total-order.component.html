<div class="card">
    <div class="card-header card-no-border pb-0">
        <div class="header-top">
            <h4>Total Order</h4>
            <app-dropdown [data]="dropdownList"></app-dropdown>
        </div>
    </div>
    <div class="card-body selling-table checkbox-checked">
        <div class="table-responsive custom-scrollbar">
            <table class="table" id="sell-product">
                <thead>
                    <tr>
                        <th>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="">
                                <label class="form-check-label"></label>
                            </div>
                        </th>
                        <th>Product Name</th>
                        <th>Order Id</th>
                        <th>Stock</th>
                        <th>Amount </th>
                        <th>Payment</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of data; track item; let ind =$index) {
                    <tr>
                        <td>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" value="">
                                <label class="form-check-label"></label>
                            </div>
                        </td>
                        <td>
                            <div class="d-flex align-items-center gap-3">
                                <div class="flex-shrink-0">
                                    <img class="img-30 b-r-10" [src]="item.imageUrl" alt="">
                                </div>
                                <div class="flex-grow-1">
                                    <a [routerLink]="['/ecommerce/products']">
                                        <h5 class="f-w-600">{{item.productName}}</h5><span>{{item.orderDate}}</span>
                                    </a>
                                </div>
                            </div>
                        </td>
                        <td>{{item.orderId}}</td>
                        <td>{{item.stock}}</td>
                        <td>${{item.amount | number : '1.2-2'}}</td>
                        <td>
                            <button [ngClass]="ind%2 ? 'bg-secondary':'bg-primary'" class="btn">{{item.paymentStatus}}</button>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</div>
