<div class="card">
    <div class="card-header pb-0">
        <h4>Area Spaline Chart </h4>
    </div>
    <div class="card-body">
        <div id="area-spaline">
            <apx-chart [chart]="areaSpaLineChart.chart" [dataLabels]="areaSpaLineChart.dataLabels"
                [stroke]="areaSpaLineChart.stroke" [series]="areaSpaLineChart.series" [xaxis]="areaSpaLineChart.xaxis"
                [colors]="areaSpaLineChart.colors" [fill]="areaSpaLineChart.tooltip">
            </apx-chart>
        </div>
    </div>
</div>
