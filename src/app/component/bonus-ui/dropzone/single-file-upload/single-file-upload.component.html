<div class="card">
    <div class="card-header pb-0">
        <h4>Single File Upload</h4>
        <p class="f-m-light mt-1"></p>Use the <code>.dropzone </code> class through create upload
        files.<code>[https://www.dropzone.dev/].</code>
    </div>
    <div class="card-body">
        <form>
            <dropzone [config]="imageConfig" (error)="onUploadError($event)" (success)="onUploadSuccess($event)"
                [className]="'custom-drop-zone'" [message]="text"></dropzone>
        </form>
    </div>
</div>
