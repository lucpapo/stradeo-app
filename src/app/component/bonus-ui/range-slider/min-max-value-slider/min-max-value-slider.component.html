
<div class="card">
    <div class="card-header">
        <h4>Min Max Value</h4>
    </div>
    <div class="card-body">
        <form class="theme-form form-label-align-right range-slider">
            <div class="form-group row py-1">
                <div class="col-md-10">
                    <ngx-slider [(value)]="value" [(highValue)]="maxvalue"  [options]="options"></ngx-slider>
                </div>
            </div>
        </form>
    </div>
</div>
