<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header pb-0">
          <h4>Image Gallery
          </h4>
        </div>
        <div class="gallery my-gallery card-body mb-0 pb-0" gallerize>
          <div class="row">
            @for(img of galleryGridData; track img){
            <figure class="col-xl-3 col-md-4 col-6" itemprop="associatedMedia">
              <a href="javascript:void(0)">
                <img class="img-thumbnail" [src]="img.srcUrl" itemprop="thumbnail" alt="Image description">
              </a>
            </figure>
            }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
