<div class="container-fluid">
  <div class="row">
    <div class="col-sm-12">
      <div class="card">
        <div class="card-header pb-0">
          <h4>Image Gallery With Description</h4>
        </div>
        <div class="my-gallery card-body gallery-with-description mb-0 pb-0" gallerize>
          <div class="row">
            @for(imgData of galleryGrid; track imgData){
            <figure class="col-xl-3 col-sm-6" itemprop="associatedMedia">
              <a href="javascript:void(0)" itemprop="contentUrl" data-size="1600x950">
                <img [src]="imgData.srcUrl" style="width: 100%;" itemprop="thumbnail" alt="Image description">
                <div class="caption">
                  <h4>{{ imgData.title }}</h4>
                  <p>{{ imgData.text }}</p>
                </div>
              </a>
            </figure>
          }
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
