<div class="row">
  @for(item of ticketData; track item){
  <div class="col-xl-4 col-sm-6 box-col-6">
    <div class="card ecommerce-widget shadow-none">
      <div class="card-body support-ticket-font bg-light-{{item.levelColor}} txt-{{item.levelColor}}">
        <div class="row">
          <div class="col-5"><span>{{item.statusTitle}}</span>
            <h3 class="total-num counter">{{item.order}}</h3>
          </div>
          <div class="col-7">
            <div class="text-end">
              <ul>
                <li>Profit
                  <span class="product-stts txt-success ms-2">{{item.profit}}
                    <i class="icon-angle-up f-12 ms-1"></i>
                  </span>
                </li>
                <li>Loss
                  <span class="product-stts txt-danger ms-2">{{item. loss}}
                    <i class="icon-angle-down f-12 ms-1"></i>
                  </span>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div class="progress-showcase mt-4">
          <div class="progress sm-progress-bar progress-striped-{{item.levelColor}}">
            <div class="progress-bar" role="progressbar" [style.width]="item.level">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  }
</div>
