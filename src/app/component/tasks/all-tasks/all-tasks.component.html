<div class="tab-pane fade active show" id="pills-created" role="tabpanel" aria-labelledby="pills-created-tab">
    <div class="card mb-0">
        <div class="card-header d-flex" [ngClass]="getTaskData.data.length >0? 'card-no-border pb-0' : '' ">
            <h4 class="mb-0">
                {{ getTaskData.title }}</h4>
            <ng-template #other>
                <h4 class="mb-0">{{ getTaskData.title }}</h4>
            </ng-template>
            <a href="javascript:void(0)">
                <app-feather-icon [icon]="'printer'" class="me-2"></app-feather-icon>
                Print
            </a>
        </div> 
        <div class="card-body p-0"> 
            <div class="taskadd">
                <div class="table-responsive custom-scrollbar">
                    <table class="table">
                        <tbody>
                            @if(getTaskData.data.length == 0){
                            <tr>
                                <div class="card-body">
                                    <div class="details-bookmark text-center"><span>No tasks found.</span></div>
                                </div>
                            </tr>
                            }
                            @for(task of getTaskData.data; track task){
                            <tr>
                                <td>
                                    <h6 class="task_title_0">{{ task.title }}</h6>
                                    <p class="project_name_0">{{ task.subtitle }}</p>
                                </td>
                                <td>
                                    <p class="task_desc_0">{{ task.text }}</p>
                                </td>
                                <td>
                                    <a class="me-2" href="javascript:void(0)">
                                        <app-feather-icon [icon]="'link'"></app-feather-icon>
                                    </a>
                                    <a href="javascript:void(0)">
                                        <app-feather-icon [icon]="'more-horizontal'"></app-feather-icon>
                                    </a>
                                </td>
                                <td>
                                    <a href="javascript:void(0)">
                                        <app-feather-icon [icon]="'trash-2'"></app-feather-icon>
                                    </a>
                                </td>
                            </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
