 <div class="card overflow-hidden">
     <div class="card-header pb-0">
         <h4 class="mb-0">Blockquotes</h4>
         <p class="f-m-light mt-1">The <code>&lt;blockquote&gt;</code> tag specifies a section that is quoted from
             another
             source.</p>
     </div>
     <div class="card-body">
        @for(item of blockquote; track item){
             <div class="figure d-block dark-blockquote" [class]="item.class">
                 <blockquote class="blockquote light-card">
                     <p class="mb-0 txt-dark">{{item.title}}</p>
                     <span class="blockquote-footer pt-3">{{item.name}}</span>
                 </blockquote>
             </div>
            }
     </div>
 </div>
