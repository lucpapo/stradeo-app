<div class="card">
    <div class="card-header pb-0">
        <h4 class="mb-0">Sizes</h4>
        <p class="mb-0 mt-1">You can change the size of avatar using <code>.img- * (70/80/90/100)</code> class.</p>
    </div>
    <div class="card-body avatar-showcase">
        <div class="avatars">
            @for( item of SizeData; track  item){
                <div class="avatar">
                    <img class="rounded-circle" [class]="item.class" [src]="item.Image" alt="sizeimg">
                </div>
            }
        </div>
    </div>
</div>
