<div class="card">
    <div class="card-header pb-0">
        <h4>Vertical Alignment</h4>
        <p class="mt-1 f-m-light"></p>You can use the <code>align-items-*</code> class
        to set the Vertical alignment.
    </div>
    <div class="card-body grid-showcase mb-0">
        <div class="row">
            @for(item of VerticalAlignmentData; track item){
            <div class="col-lg-4">
                <div class="row grid-vertical m-1 g-2 bg-light" [class]="item.title1">
                    <div class="col-6"><span class="bg-white">one column</span></div>
                    <div class="col-6"><span class="bg-white">two column</span></div>
                </div>
            </div>
            }
        </div>
    </div>
    <div class="card-footer">
        <div class="table-responsive custom-scrollbar">
            <table class="w-100">
                <tbody>
                    <tr>
                        <th> Class</th>
                        <th>Value of the class</th>
                    </tr>
                    <tr>
                        <td><code>.align-items-*</code></td>
                        <td> start / center / end / baseline / stretch</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
