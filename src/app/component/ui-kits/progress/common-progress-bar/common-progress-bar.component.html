@for(data of data; track data){
 <div class="card">
     <div class="card-header pb-0">
         <h4>{{data.mainTitle}}</h4>
         <p class="f-m-light mt-1" [innerHTML]="data.title">
         </p>
     </div>
     <div class="card-body">
         <div class="progress-showcase row">
             <div class="col">
                @for( item of data.item; track item){
                 <div class="progress">
                     <div [class]="item.class" role="progressbar" [ngStyle]="{'width':item.value}"
                         aria-valuenow=" 0" aria-valuemin="0" aria-valuemax="100">
                         @if(item.percentage){
                            {{item.percentage}}
                         }
                     </div>
                 </div>
                }
             </div>
         </div>
     </div>
 </div>
}
