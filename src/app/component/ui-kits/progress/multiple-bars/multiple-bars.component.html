@for(multiple of multiPalBarData; track multiple){
<div class="card">
    <div class="card-header pb-0">
        <h4>{{multiple.mainTitle}}</h4>
        <p class="f-m-light mt-1">{{multiple.title}}</p>
    </div>
    <div class="card-body">
        <div class="progress-showcase row">
            <div class="col">
                <div class="progress">
                    @for(multipleItem of multiple.item; track multipleItem){
                    <div class="progress-bar {{multipleItem.class}}" role="progressbar"
                        [ngStyle]="{'width':multipleItem.value}" aria-valuenow="30" aria-valuemin="0"
                        aria-valuemax="100"></div>
                    }
                </div>
                <div class="progress">
                    @for(othersData of multiple.item2; track othersData){
                    <div class="progress-bar {{othersData.class}}" role="progressbar"
                        [ngStyle]="{'width':othersData.value}" aria-valuenow="15" aria-valuemin="0" aria-valuemax="100">
                    </div>
                    }
                </div>
            </div>
        </div>
    </div>
</div>
}
