<div class="card">
    <div class="card-header pb-0">
        <h4>Custom Height Progress Bars</h4>
        <p class="f-m-light mt-1">Set a height value on the <code>.progress-bar</code>, so if you change that value
            the
            outer<code>.progress</code> will automatically resize accordingly.</p>
    </div>
    <div class="card-body">
        <div class="progress-showcase row">
            <div class="col">
                @for(item of customHeightData; track item){
                <div class="progress" [ngStyle]="{'height':item.value1}">
                    <div class="progress-bar" [class]="item.class" role="progressbar"
                        [ngStyle]="{'width':item.value2}" aria-valuenow="25" aria-valuemin="0"
                        aria-valuemax="100"></div>
                </div>
                }
            </div>
        </div>
    </div>
</div>
