 <div class="card split-basic-dropdown">
     <div class="card-header pb-0">
         <h4> Split Dropdown</h4>
         <p class="f-m-light mt-1">When the<code>.show </code>class starts, dropdown appears. And
             split the dropdown <code>.dropdown-toggle-split</code>.
         </p>
     </div>
     <div class="card-body dropdown-basic me-0">
         <div class="common-flex spilt-dropdown-card"> 
            @for(splitItem of splitDropdownData; track splitItem){
             <div class="btn-group">
                 <button class="btn btn-outline-{{splitItem.class}}" type="button">{{splitItem.title}}</button>
                 <div class="dropdown separated-btn" ngbDropdown>
                     <button class="btn btn-{{splitItem.class}}" type="button" ngbDropdownToggle>
                         <i class="icofont icofont-arrow-down"></i>
                     </button> 
                     <div class="dropdown-content" ngbDropdownMenu>
                        @for(spiltData of splitItem.item; track spiltData){
                            <a href="javascript:void(0)" ngbDropdownItem>{{spiltData.list}}</a>
                         } 
                     </div>
                 </div>
             </div>
            }
         </div>
     </div>
 </div>
