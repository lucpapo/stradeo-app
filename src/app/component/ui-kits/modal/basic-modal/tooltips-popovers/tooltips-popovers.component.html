<button class="btn btn-info" type="button" 
    (click)="tooltipModal(tooltipModalContent)">Tooltips and
    popovers</button>
<ng-template #tooltipModalContent let-modal>
    <div class="modal-content">
        <div class="modal-header">
            <h4 class="modal-title">Tooltip and popover modal</h4>
            <button class="btn-close py-0" type="button" (click)="modal.dismiss('Cross click')"></button>
        </div>
        <div class="modal-body">
            <h4>Popover in a modal</h4>
            <p class="mt-2">This <a class="btn btn-success popover-test" role="button"
                ngbPopover="this is amazing content" popoverTitle="popover">button</a> triggers a popover on click.
            </p>
            <hr>    
            <h4>Tooltips in a modal</h4>
            <p class="mt-2">
                    <a class="tooltip-test text-info" href="javascript:void(0)" popoverTitle="Tooltip" ngbPopover="tooltip">This link</a> and 
                    <a class="tooltip-test text-info" href="javascript:void(0)" popoverTitle="Tooltip" ngbPopover="tooltip">that link</a> have tooltips on hover.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" type="button" data-bs-dismiss="modal"
                (click)="modal.dismiss('Cross click')">Close</button>
            <button class="btn btn-primary" type="button">Save changes</button>
        </div>
    </div>
</ng-template>
