<div class="card">
    <div class="card-header">
        <h4>Activity Log</h4>
    </div>
    <div class="card-body">
        <div class="activity-log">
            @for(data of activityLogData; track data){
            <div class="my-activity">
                <h6 class="f-w-600 mb-3">{{ data.title }}</h6>
                @for(item of data.data; track item){
                <p>
                    <span>
                        <app-feather-icon [icon]="item.icon" [class]="'m-r-20'"></app-feather-icon>
                    </span>
                    {{ item.data }}
                </p>
                }
            </div>
            }
        </div>
    </div>
</div>
