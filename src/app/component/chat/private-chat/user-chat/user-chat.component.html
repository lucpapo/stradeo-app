<div class="card right-sidebar-chat" (clickOutside)="clickOutside()">
    <div class="right-sidebar-title">
        <div class="common-space">
            <div class="chat-time">
                <div class="active-profile">
                    <img class="img-fluid rounded-circle" src="assets/images/blog/comment.jpg" alt="user">
                    <div class="status bg-success"></div>
                </div>
                <div> <span>Darrell Steward</span>
                    <p>Online </p>
                </div>
            </div>
            <div class="d-flex gap-2">
                <div class="contact-edit chat-alert bg-light-secondary"><i class="icon-info-alt txt-secondary"></i></div>
                <div class="contact-edit chat-alert bg-light-primary stroke-primary">
                     <app-common-svg-icons [class]="'dropdown-toggle'" [icon]="'menubar'" (click)="isOpen =!isOpen"></app-common-svg-icons>
                    <div class="dropdown-menu dropdown-menu-end" [class.show]="isOpen" style="position: absolute;
                    inset: 0px 0px auto auto;
                    margin: 0px;
                    transform: translate(-36px, 44px);">
                        <a class="dropdown-item" href="javascript:void(0)"> View details</a>
                        <a class="dropdown-item" href="javascript:void(0)"> Send messages</a>
                        <a class="dropdown-item" href="javascript:void(0)"> Add to favorites</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="right-sidebar-Chats">
        <div class="msger">
            <div class="msger-chat">
                @for(data of msgData; track data){
                <div class="msg {{data.side}}-msg">
                    <div class="msg-img"></div>
                    <div class="msg-bubble">
                        <div class="msg-info">
                            <div class="msg-info-name">{{data.name}}</div>
                            <div class="msg-info-time">{{data.time}}</div>
                        </div>
                        <div class="msg-text">{{data.text}}
                        </div>
                    </div>
                </div>
                }
            </div>
            <form class="msger-inputarea">
                <div class="dropdown-form dropdown-toggle" [class.show]="isShow">
                    <i class="icon-plus" (click)="isShow =!isShow"></i>
                    <div class="chat-icon dropdown-menu dropdown-menu-start" [class.show]="isShow" 
                    style="position: absolute; inset: auto auto 0px 0px; margin: 0px; transform: translate(0px, -43px);">
                        <div class="dropdown-item mb-2">
                            <svg>
                                <use href="assets/svg/icon-sprite.svg#camera"></use>
                            </svg>
                        </div>
                        <div class="dropdown-item">
                            <svg>
                                <use href="assets/svg/icon-sprite.svg#attchment"></use>
                            </svg>
                        </div>
                    </div>
                </div>
                <input class="msger-input two uk-textarea" type="text" placeholder="Type Message here..">
                <div class="open-emoji">
                    <div class="second-btn uk-button"></div>
                </div>
                <button class="msger-send-btn" type="submit"><i class="fa fa-location-arrow"></i></button>
            </form>
        </div>
    </div>
</div>
