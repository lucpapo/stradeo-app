<div class="card">
  <div class="card-header pb-0">
    <h4>Clipboard On Textarea</h4>
  </div>
  <div class="card-body"> 
    <div class="clipboaard-container">
      <p class="f-16">Cut/copy from textarea</p>
      <textarea class="form-control custom-scrollbar" id="clipboardExample2" [(ngModel)]="clipboardExample2" name="clipboardExample2"
        rows="1" spellcheck="false"></textarea>
      <div class="mt-3 text-end"> 
        <button class="btn btn-warning btn-clipboard me-2" type="button" (click)="copyFunction(clipboardExample2)">
          <i class="fa fa-copy"></i> Copy</button>
        <button class="btn btn-success btn-clipboard-cut me-2" type="button"
          (click)="cutFunction('clipboardExample2')"><i class="fa fa-cut"></i> Cut</button>
      </div>
    </div>
  </div>
</div>
